version: '3.8'

# Описание всех контейнеров (сервисов), которые запустятся вместе
services:
  # Сервис Node.js приложения
  app:
    build: ./app
    container_name: todo-app
    restart: always
    ports:
      - "5000:5000"
    # --- ДОБАВЛЯЕМ ЭТУ СТРОКУ ---
    # Docker сам прочитает файл .env из корня проекта и запишет переменные в систему
    env_file:
      - .env  
    depends_on:
      mongodb:
        condition: service_healthy
    user: "root"
    command: node src/server.js
    volumes:
      - ./app:/app
      - /app/node_modules


  # Сервис базы данных MongoDB
  mongodb:
    image: mongo:latest # Скачивание официального образа MongoDB из Docker Hub
    container_name: todo-mongo # Имя контейнера базы данных (используется как сетевой хост для приложения)
    restart: always # Перезапускать при падениях
    ports:
      - "27017:27017" # Проброс стандартного порта MongoDB наружу
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin # Логин суперадминистратора для создания базы
      MONGO_INITDB_ROOT_PASSWORD: secret # Пароль суперадминистратора
      MONGO_INITDB_DATABASE: todo # Имя базы данных, которая создастся автоматически при старте
    volumes:
      - mongo_data:/data/db # Сохранение данных базы на жестком диске, чтобы они не пропали при остановке контейнера
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"] # Команда проверяет, отвечает ли база на запросы
      interval: 10s # Проверять каждые 10 секунд
      timeout: 5s # Ждать ответ не больше 5 секунд
      retries: 5 # Число попыток

# Объявление постоянного хранилища (Volume) для сохранения данных MongoDB
volumes:
  mongo_data: