# Название пайплайна, отображаемое в интерфейсе GitHub
name: CI - Build, Test, Push

# Триггеры запуска: автоматический старт при пуше или Pull Request в ветку main
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Переменные окружения для всего процесса сборки
env:
  REGISTRY: docker.io # Адрес реестра (Docker Hub)
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/nodejs-todo # Имя репозитория (берется из секретов)
  IMAGE_TAG: ${{ github.sha }} # Уникальный тег образа, равный хэшу git-коммита

jobs:
  build-and-push:
    runs-on: ubuntu-latest # Пайплайн запускается на чистой виртуальной машине Ubuntu
    steps:
      # Шаг 1: Скачивание исходного кода репозитория на виртуальную машину
      - name: Checkout code
        uses: actions/checkout@v4
      
      # Шаг 2: Установка Node.js нужной версии и включение кэширования зависимостей
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      # Шаг 3: Чистая установка всех npm-пакетов из package-lock.json
      - name: Install dependencies
        working-directory: ./app
        run: npm ci

      # Шаг 4: Запуск автотестов. Если тестов пока нет, заглушка не даст пайплайну упасть
      - name: Run tests
        working-directory: ./app
        run: npm test || echo "No tests yet"

      # Шаг 5: Инициализация Docker Buildx для продвинутой и быстрой сборки образов
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Шаг 6: Авторизация в Docker Hub 
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_TOKEN }}
      
      # Шаг 7: Сборка Docker-образа и его пуш на Docker Hub под двумя тегами (хэш и latest)
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Шаг 8: Автоматическая замена тега образа в Kubernetes-манифесте на только что собранный
      - name: Update image tag in Kubernetes manifests
        run: |
          sed -i "s|image:.*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}|" manifests/deployment.yaml

      # Шаг 9: Сохранение изменений манифеста и пуш обратно в репозиторий от имени бота.
      # [skip ci] нужен, чтобы этот пуш не запустил бесконечный цикл сборок.
      - name: Commit and push manifest changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add manifests/deployment.yaml
          git commit -m "ci: update image tag to ${{ env.IMAGE_TAG }} [skip ci]" || echo "No changes"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

